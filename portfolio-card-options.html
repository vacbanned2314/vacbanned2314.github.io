<!doctype html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Варианты карточек портфолио | ТеплоРемСервис</title>
    <link rel="stylesheet" href="css/variables.css?v=20260817-1635">
    <link rel="stylesheet" href="css/base.css?v=20260825-font-1">
    <link rel="stylesheet" href="css/design-system.css?v=20260825-font-1">
    <link rel="stylesheet" href="css/portfolio-concepts.css?v=20260827-13">
    <link rel="stylesheet" href="css/portfolio-card-options.css?v=20260827-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body class="portfolio-concepts-page portfolio-live-page card-options-page">
    <main class="card-options">
        <div class="container">
            <a class="co-back" href="portfolio.html">← Вернуться к текущему портфолио</a>
            <header class="co-header">
                <p class="pc-kicker"><span></span> Сравнение вариантов</p>
                <h1>Карточки проектов</h1>
                <p>Сетка, фотографии, размеры карточек и порядок объектов во всех вариантах одинаковые. Меняется только текст и его обрамление.</p>
            </header>

            <div class="co-variants" role="tablist" aria-label="Варианты оформления карточки">
                <button type="button" role="tab" aria-selected="true" data-card-variant="plain"><b>01</b><span>Подпись на фото</span></button>
                <button type="button" role="tab" aria-selected="false" data-card-variant="rail"><b>02</b><span>Техническая метка</span></button>
                <button type="button" role="tab" aria-selected="false" data-card-variant="frame"><b>03</b><span>Внутренняя рамка</span></button>
                <button type="button" role="tab" aria-selected="false" data-card-variant="sheet"><b>04</b><span>Паспорт объекта</span></button>
            </div>

            <p class="co-hint" id="variant-hint">Чистая подпись в нижней части кадра. Ничего не отвлекает от фотографии.</p>

            <section class="case-grid co-grid" id="card-options-grid" data-variant="plain" aria-label="Примеры карточек">
                <button type="button" class="co-card co-card--wide" data-project="Голубятникова">
                    <img src="assets/portfolio/Казань, ул.Голубятникова/20240911_184138.webp" alt="Насосные группы котельной на улице Голубятникова">
                    <span class="co-card__shade"></span>
                    <span class="co-card__content">
                        <span class="co-card__meta"><span>Казань, ул. Голубятникова</span><span>8 фото</span></span>
                        <strong>Котельная на улице Голубятникова</strong>
                        <span class="co-card__copy">Собрали котельную с двумя напольными котлами и насосными группами.</span>
                        <span class="co-card__tap">Нажмите, чтобы увидеть акцент</span>
                    </span>
                </button>

                <button type="button" class="co-card co-card--large" data-project="Нагорный">
                    <img src="assets/portfolio/Монтаж - Казань пос.Нагорный ул.Галеева/20230828_180810.webp" alt="Котельная в посёлке Нагорный">
                    <span class="co-card__shade"></span>
                    <span class="co-card__content">
                        <span class="co-card__meta"><span>Казань, пос. Нагорный</span><span>4 фото</span></span>
                        <strong>Котельная в посёлке Нагорный</strong>
                        <span class="co-card__copy">Смонтировали насосные группы, автоматику и водоподготовку.</span>
                        <span class="co-card__tap">Нажмите, чтобы увидеть акцент</span>
                    </span>
                </button>

                <button type="button" class="co-card co-card--full" data-project="Садовая">
                    <img src="assets/portfolio/Монтаж - Лаишево ул. Садовая/20240506_182453.webp" alt="Отопительные контуры на улице Садовой">
                    <span class="co-card__shade"></span>
                    <span class="co-card__content">
                        <span class="co-card__meta"><span>Лаишево, ул. Садовая</span><span>5 фото</span></span>
                        <strong>Котельная и отопление на улице Садовой</strong>
                        <span class="co-card__copy">Собрали котельную, отопительные контуры, водоподготовку и радиаторы.</span>
                        <span class="co-card__tap">Нажмите, чтобы увидеть акцент</span>
                    </span>
                </button>
            </section>
        </div>
    </main>
    <script defer src="js/pages/portfolio-card-options.js?v=20260827-1"></script>
</body>
</html>
